[project]
name = "byteclasses"
version = "0.6.0"
description = "A Python package for efficient manipulation of binary data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Justin C", email = "justin@thetacom.info" },
]
keywords = ["struct", "structures", "binary", "blobs", "raw", "bytes", "dataclasses", "union", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["rich>=13.7.1"]

[project.urls]
Repository = "https://github.com/thetacom/byteclasses"
Documentation = "https://io.thetacom.info/byteclasses/"

[dependency-groups]
lint = ["ruff>=0.12"]
typecheck = ["mypy>=1.9"]
test = ["pytest>=8.1", "pytest-cov>=5"]
docs = [
    "myst-parser>=2",
    "nbsphinx>=0.9.3",
    "sphinx>=7.2.6",
    "sphinx-material>=0.0.36",
]
notebook = [
    "ipykernel>=6.29.3",
    "ipython>=8.22.2",
    "nbqa[toolchain]>=1.8.5",
]
dev = [
    { include-group = "lint" },
    { include-group = "typecheck" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "notebook" },
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
exclude = ['test_.+\.py$']
disable_error_code = ["arg-type", "assignment"]

[tool.pytest.ini_options]
minversion = "8.1"
addopts = "-ra --cov=byteclasses --cov-report=term-missing --doctest-modules"
testpaths = ["tests", "byteclasses"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10
